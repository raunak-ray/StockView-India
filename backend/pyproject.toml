[project]
name = "stockview-backend"
version = "0.1.0"
description = "StockView India - FastAPI backend (modular monolith, per plan/01)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "alembic",
    "psycopg[binary]",
    "redis",
    "arq",
    "apscheduler",
    "httpx",
    "yfinance>=0.2.37",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11.0",
    "nsepython>=2.0",
    "pyotp>=2.9",
    "pyjwt",
    "argon2-cffi",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
ml-heavy = ["xgboost", "lightgbm", "catboost", "torch", "transformers", "shap"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100